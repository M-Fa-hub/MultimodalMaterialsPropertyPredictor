seed: 42
target: band_gap
unit: eV

data:
  processed_dir: data/processed
  images_dir: data/images
  split_strategy: random  # composition preferred for Materials Project
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  dataset_version: v1

models:
  dummy: true
  random_forest:
    n_estimators: 200
    max_depth: 20
    min_samples_leaf: 2
    n_jobs: -1
  extra_trees:
    n_estimators: 200
    max_depth: 20
    min_samples_leaf: 2
    n_jobs: -1
  xgboost:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
  tabular_mlp:
    hidden_dims: [256, 128, 64]
    dropout: 0.2
    epochs: 50
    batch_size: 64
    lr: 0.001
    weight_decay: 0.0001
    early_stopping_patience: 10

output:
  metrics_path: outputs/figures/baseline_metrics.json
  models_dir: outputs/models/baselines
  mlflow_experiment: materials-bandgap-baselines
