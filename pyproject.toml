[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "materials-ai"
version = "0.1.0"
description = "Multimodal Materials Property Predictor — band-gap regression from structure images and tabular descriptors"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AI/ML Portfolio" }]
keywords = ["materials-science", "multimodal", "computer-vision", "pytorch", "band-gap"]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "scikit-learn>=1.3",
    "torch>=2.1",
    "torchvision>=0.16",
    "Pillow>=10.0",
    "matplotlib>=3.8",
    "pymatgen>=2024.1",
    "ase>=3.22",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.6",
    "streamlit>=1.30",
    "mlflow>=2.10",
    "shap>=0.44",
    "tqdm>=4.66",
    "joblib>=1.3",
    "httpx>=0.26",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
mp = ["mp-api>=0.41"]
boost = ["xgboost>=2.0", "lightgbm>=4.0"]
text = ["sentence-transformers>=2.3", "transformers>=4.36"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.2",
    "mypy>=1.8",
    "types-PyYAML>=6.0",
    "types-Pillow>=10.0",
]
all = ["materials-ai[mp,boost,text,dev]"]

[project.scripts]
materials-prepare = "materials_ai.cli:prepare_dataset"
materials-train-baseline = "materials_ai.cli:train_baseline"
materials-train-multimodal = "materials_ai.cli:train_multimodal"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "scripts", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
packages = ["materials_ai"]
exclude = ["\\.venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: end-to-end or long-running tests",
]
